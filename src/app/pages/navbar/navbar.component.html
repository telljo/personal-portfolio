<nav class="navbar__shell" aria-label="Main navigation">
  <div class="u-container navbar__inner">
    <a class="navbar__brand" routerLink="/" aria-label="Josh Tell home">
      <img src="assets/Images/logo.webp" alt="" width="1024" height="1024" class="navbar__logo">
    </a>
    <button #menuToggle (click)="toggleNav()" class="navbar__button" type="button" [attr.aria-label]="navShow() ? 'Close navigation' : 'Open navigation'" aria-controls="main-navigation-links" [attr.aria-expanded]="navShow()">
      <app-icon [name]="navShow() ? 'times' : 'bars'"></app-icon>
    </button>
    <div id="main-navigation-links" class="navbar__links" [class.navbar__links--open]="navShow()">
      @for (link of navLinks; track link.path) {
        <a class="navbar__link" [routerLink]="link.path" routerLinkActive="navbar__link--active" [routerLinkActiveOptions]="exactMatchOptions" ariaCurrentWhenActive="page">{{ link.label }}</a>
      }
    </div>
  </div>
</nav>
